[project]
name = "neurohunter"
version = "0.1.0"
description = ""
authors = [
    {name = "Будник Кристина",email = "ssspers92@gmail.com"}
]
requires-python = ">=3.13"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.52.1,<0.53.0)",
    "pymongo (>=4.17.0,<5.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "dotenv (>=0.9.9,<0.10.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "pydantic-settings (>=2.14.2,<3.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "alembic (>=1.19.0,<2.0.0)",
    "sqlalchemy (>=2.0.51,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "fastapi-mail (>=1.6.8,<2.0.0)",
    "fastapi-users[sqlalchemy] (>=15.0.5,<16.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "ruff (>=0.16.1,<0.17.0)",
    "isort (>=8.0.1,<9.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)"
]

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 1
use_parentheses = true
known_first_party = ["services"]

[tool.poetry.dependencies]
python = "^3.13"
httpx = "^0.28.1"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["app/tests"]
